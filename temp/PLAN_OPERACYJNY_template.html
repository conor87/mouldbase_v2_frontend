<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan operacyjny — template 1 strona</title>
  <style>
    :root {
      --ink: #111;
      --paper: #f7f4e9;
      --line: #2b2b2b;
      --bg: #ecebe6;
      --muted: #555;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 8px 0 18px;
    }

    .sheet {
      width: 190mm;
      min-height: 279mm;
      margin: 8px auto;
      padding: 6mm 6mm 5mm;
      border: 1px solid var(--ink);
      background: var(--paper);
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      gap: 4mm;
    }

    .header {
      text-align: center;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2mm;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .4px;
      line-height: 1.05;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 3px 8px;
      align-items: end;
    }
    .field { min-width: 0; }
    .field.span-2 { grid-column: span 2; }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .45px;
      line-height: 1.1;
      color: #2e2e2e;
      margin-bottom: 2px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea {
      width: 100%;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: inherit;
    }

    .meta input[type="text"],
    .meta input[type="number"],
    .meta input[type="date"] {
      border: none;
      border-bottom: 1px dotted var(--line);
      padding: 1px 0 2px;
      font-size: 11px;
      min-height: 20px;
    }

    .meta input[readonly] {
      opacity: 1;
      cursor: default;
    }

    .table-wrap {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 0;
    }
    col.no-col, col.time-col, col.sign-col { width: 12.5%; }
    col.desc-col { width: 62.5%; }

    th, td {
      border: 1px solid var(--line);
      padding: 4px 5px;
      vertical-align: top;
      font-size: 11px;
    }
    th {
      background: rgba(0,0,0,.03);
      text-transform: uppercase;
      letter-spacing: .35px;
      font-size: 10px;
      line-height: 1.15;
      text-align: center;
    }
    td.no,
    td.time,
    td.sign { vertical-align: middle; }

    .cell-editor {
      display: block;
      border: none;
      padding: 0;
      margin: 0;
      background: transparent;
      resize: none;
      overflow: hidden;
      min-height: 1.2em;
      line-height: 1.35;
      font-size: 11px;
    }
    .no-editor,
    .time-editor,
    .sign-editor { text-align: center; }
    .no-editor { font-weight: 700; }

    .approvals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-top: auto;
    }
    .approval-box {
      border: 1px solid var(--line);
      padding: 5px 7px 6px;
      min-height: 52px;
      background: rgba(255,255,255,.12);
    }
    .approval-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px;
      align-items: end;
    }
    .approval-box input[type="text"],
    .approval-box input[type="date"] {
      border: none;
      padding: 1px 0 0;
      font-size: 11px;
      min-height: 18px;
    }

    .toolbar {
      width: 190mm;
      margin: 12px auto 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 2px solid var(--ink);
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: .25px;
    }
    .btn:hover { background: #f3f3f3; }

    .footer-note {
      width: 190mm;
      margin: 0 auto;
      font-size: 11px;
      color: var(--muted);
    }

    @page {
      size: A4 portrait;
      margin: 8mm;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .sheet {
        margin: 0;
        border: none;
        box-shadow: none;
        width: auto;
        min-height: auto;
        padding: 0;
        gap: 2.5mm;
      }
      .header {
        padding-bottom: 1mm;
      }
      .header h1 {
        font-size: 15px;
        letter-spacing: .2px;
      }
      .meta {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 2px 6px;
      }
      .label {
        font-size: 8px;
        margin-bottom: 1px;
        letter-spacing: .25px;
      }
      .meta input[type="text"],
      .meta input[type="number"],
      .meta input[type="date"] {
        font-size: 10px;
        min-height: 14px;
        padding: 0 0 1px;
      }
      th, td {
        padding: 3px 4px;
        font-size: 10px;
      }
      th {
        font-size: 9px;
      }
      .cell-editor {
        font-size: 10px;
        line-height: 1.25;
      }
      .approvals {
        gap: 6px 10px;
      }
      .approval-box {
        min-height: 40px;
        padding: 4px 6px 5px;
      }
      .approval-row {
        grid-template-columns: 88px 1fr;
        gap: 6px;
      }
      .approval-box input[type="text"],
      .approval-box input[type="date"] {
        font-size: 10px;
        min-height: 14px;
        padding: 0;
      }
      .toolbar,
      .footer-note { display: none; }
    }

    @media screen and (max-width: 920px) {
      .sheet, .toolbar, .footer-note {
        width: calc(100vw - 16px);
      }
      .meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .field.span-2 { grid-column: span 1; }
      .approvals {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <div class="toolbar">

  <div class="footer-note">Jednostronicowy template przygotowany pod druk A4 w pionie.</div>

  <script>
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.max(el.scrollHeight, 18) + 'px';
    }

    function resizeAllEditors() {
      document.querySelectorAll('.cell-editor').forEach(autoResize);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      }[char]));
    }

    function setDefaultsForSave(root) {
      root.querySelectorAll('input').forEach(input => {
        input.setAttribute('value', input.value);
      });
      root.querySelectorAll('textarea').forEach(textarea => {
        textarea.textContent = textarea.value;
        textarea.innerHTML = escapeHtml(textarea.value);
        textarea.style.height = textarea.style.height || 'auto';
      });
    }

    document.addEventListener('input', (event) => {
      const target = event.target;
      if (target.classList.contains('cell-editor')) autoResize(target);
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      resizeAllEditors();
      window.print();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      document.querySelectorAll('input[type="text"], input[type="number"], input[type="date"], textarea').forEach(el => {
        if (el.type === 'number' && el.previousElementSibling === null) {
          el.value = '';
          return;
        }
        if (el.type === 'number' && el.closest('.field') && el.closest('.field').querySelector('.label')?.textContent.trim() === 'Ilość arkuszy') {
          el.value = '1';
          return;
        }
        if (el.readOnly) {
          el.value = '1/1';
          return;
        }
        el.value = '';
      });
      resizeAllEditors();
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      resizeAllEditors();
      const clone = document.documentElement.cloneNode(true);
      setDefaultsForSave(clone);
      const blob = new Blob(['<!doctype html>
' + clone.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'PLAN_OPERACYJNY_template_1strona_wypelniony.html';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    resizeAllEditors();
  </script>
